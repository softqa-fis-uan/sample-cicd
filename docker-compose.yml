name: greetings-api
networks:
    jenkins:
services:
    python-app:
        privileged: true
        build: ./python
        ports:
            - "8000:8000"
        networks:
            - jenkins
    jenkins:
        build: ./.jenkins/docker
        privileged: true # Required for Docker-in-Docker scenarios or some plugins
        user: root # Run as root to avoid permission issues, especially for Docker integration
        ports:
            - "8080:8080" # Jenkins web interface
            - "50000:50000" # For Jenkins agents
        volumes:
            - jenkins_home:/var/jenkins_home # Persistent storage for Jenkins data
            - /var/run/docker.sock:/var/run/docker.sock # Allow Jenkins to interact with Docker daemon
            - /usr/bin/docker:/usr/bin/docker # Make Docker executable available inside the container
        environment:
            - DOCKER_HOST=tcp://docker:2375 # If you are running Docker daemon in a separate service
            - JENKINS_ADMIN_PASSWORD=${JENKINS_ADMIN_PASSWORD:?set it in .env}
        restart: unless-stopped # Automatically restart Jenkins unless manually stopped
        networks:
            - jenkins

volumes:
    jenkins_home: # Define the named volume for persistence
