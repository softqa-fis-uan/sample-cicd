version: 2
updates:
  - package-ecosystem: "docker"
    directories:
      - "/python"
      - "/java"
      - "/.jenkins/docker"
    schedule:
      interval: "weekly"

  - package-ecosystem: "gradle"
    directory: "/java"
    schedule:
      interval: "weekly"

  - package-ecosystem: "uv"
    directory: "/python"
    schedule:
      interval: "weekly"

  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
